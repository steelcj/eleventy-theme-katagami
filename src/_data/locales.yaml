# Languages of the site. `dir` sets the text direction of every page in that
# language. A fixture locale builds everywhere but is left out of the language
# switcher in production builds. `fontSet: arabic` sets text in the font set's
# Arabic companion font and preloads it.
- { code: en, name: English, dir: ltr }
- { code: fr, name: Français, dir: ltr }
- { code: ar, name: العربية, dir: rtl, fontSet: arabic, fixture: true }
