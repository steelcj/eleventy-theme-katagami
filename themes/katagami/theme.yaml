name: katagami
title: Katagami
version: 0.5.1
description: A Plone-inspired Eleventy theme with a vintage Japanese, minimalist style.
author: Vishpala
license: MIT
eleventy: ">=3.0.0 <4.0.0"
regions: [header, abovecontent, content, sidebar, belowcontent, footer]
parts: [skip-links, logo, main-nav, language-switcher, ui-options, breadcrumbs, section-nav, footer-text, site-actions, colophon]
templates: [languages]
blocks: [text, image, teaser, listing, grid, call-to-action]
views: [listing, summary, tabular, album]
fences: []
# Font sets. Each set is one CSS file, assets/css/fonts/<name>.css, generated by
# scripts/vendor-fonts.mjs from the fonts below. The site picks a default with
# `fontSet` in src/_data/site.yaml, and readers can switch.
fontSets:
  default: hyperlegible
  sets:
    hyperlegible:
      heading: atkinson-hyperlegible-next
      body: atkinson-hyperlegible-next
      arabic: ibm-plex-sans-arabic
    mincho:
      heading: shippori-mincho
      body: atkinson-hyperlegible-next
      arabic: noto-naskh-arabic
    gothic:
      heading: zen-kaku-gothic-new
      body: atkinson-hyperlegible-next
      arabic: ibm-plex-sans-arabic
# Reader preferences: Fluid Infusion UI Options, at this exact version, copied into
# assets/vendor/infusion/ by scripts/vendor-infusion.mjs and loaded only when a reader
# opens the preferences panel. Contrast schemes are defined in assets/css/tokens.css.
preferences:
  infusion: 4.8.0
  contrast: [default, high, dark]
# Fonts, from Fontsource packages, all under the SIL Open Font License 1.1. Only the
# 400 and 700 weights of the listed subsets are kept, in assets/fonts/<name>/.
fonts:
  atkinson-hyperlegible-next: { version: 5.3.0, subsets: [latin, latin-ext], generic: sans-serif }
  shippori-mincho: { version: 5.3.0, subsets: [latin, latin-ext], generic: serif }
  zen-kaku-gothic-new: { version: 5.3.1, subsets: [latin, latin-ext], generic: sans-serif }
  noto-naskh-arabic: { version: 5.3.0, subsets: [arabic], generic: serif }
  ibm-plex-sans-arabic: { version: 5.3.0, subsets: [arabic], generic: sans-serif }
# Images are processed at build time from src/media/. Only the processed files are
# published. `sizes` rules match where an image appears.
images:
  formats: [avif, webp, auto]
  widths: [320, 640, 960, 1280]
  sizes:
    content: "(min-width: 48rem) 42rem, 100vw"
    card: "(min-width: 48rem) 20rem, 100vw"
    thumbnail: "(min-width: 48rem) 10rem, 6rem"
